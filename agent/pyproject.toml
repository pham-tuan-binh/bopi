[project]
name = "bopi-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "livekit-agents[elevenlabs,silero,turn-detector]~=1.4",
    "python-dotenv~=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bopi_agent"]

[project.scripts]
bopi-agent = "bopi_agent:main"
